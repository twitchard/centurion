<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centurion Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #1c1612; color: #ece3d2;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .root {
      display: grid;
      grid-template-columns: minmax(280px, 36%) 1fr;
      height: 100dvh;
      gap: 10px;
      padding: 10px;
    }
    .inputs {
      display: flex; flex-direction: column; gap: 8px;
      border: 1px solid #57422a; border-radius: 6px;
      background: #241c15; padding: 10px; overflow: auto;
    }
    label { font-size: 0.82rem; color: #c2b193; font-variant: small-caps; letter-spacing: 0.5px; }
    textarea {
      width: 100%; border: 1px solid #6e5433; border-radius: 4px;
      background: #14100c; color: #ece3d2; padding: 0.6rem;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      min-height: 110px; resize: vertical;
    }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .mode-toggle {
      display: inline-flex; align-self: flex-start;
      border: 1px solid #6e5433; border-radius: 4px; overflow: hidden;
    }
    .mode-toggle button {
      border: none; background: transparent; color: #c2b193;
      font-family: "Cinzel", "Trajan Pro", Georgia, serif;
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.5px; padding: 5px 14px; cursor: pointer;
    }
    .mode-toggle button + button { border-left: 1px solid #6e5433; }
    .mode-toggle button.active { background: #c9a227; color: #241a09; }
    .ok  { color: #8fae57; font-size: 0.78rem; }
    .err { color: #e28d7f; font-size: 0.78rem; }
    .board-wrap {
      border: 1px solid #57422a; border-radius: 6px;
      background: #241c15;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    canvas { display: block; }
    @media (max-width: 720px) {
      .root { grid-template-columns: 1fr; height: auto; }
      .board-wrap { min-height: 300px; }
    }
  </style>
</head>
<body>
  <div class="root">
    <div class="inputs">
      <label for="board-fen-input">FEN positions (newline or semicolon separated)</label>
      <textarea id="board-fen-input" spellcheck="false"></textarea>
      <ul id="board-fen-diagnostics"></ul>

      <label for="board-arrow-input">Arrows (e.g. e2-&gt;e4, one per line)</label>
      <textarea id="board-arrow-input" spellcheck="false"></textarea>
      <ul id="board-arrow-diagnostics"></ul>

      <label>Piece display</label>
      <div class="mode-toggle" role="group" aria-label="Piece display mode">
        <button type="button" id="board-mode-pieces">Pieces</button>
        <button type="button" id="board-mode-letters">Letters</button>
      </div>
    </div>
    <div class="board-wrap" id="board-wrap">
      <canvas id="board-canvas"></canvas>
    </div>
  </div>
  <script type="module" src="./src/board.ts"></script>
</body>
</html>
