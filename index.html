<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centurion Chess</title>
</head>
<body>
  <section id="screen-labs-menu" class="screen screen-menu">
    <h1>Centurion Chess Labs</h1>
    <p class="subtitle">Experimental features and dev tools</p>
    <div class="menu-buttons">
      <button class="btn btn-primary" id="labs-menu-open-superposition">Superposition Board Lab</button>
      <button class="btn btn-secondary" id="labs-menu-open-chat">P2P Chat Lab</button>
      <button class="btn btn-outline" id="labs-menu-open-centurion">Centurion Match</button>
      <button class="btn btn-outline" id="labs-menu-back-btn">← Back to Game</button>
    </div>
  </section>

  <section id="screen-superposition-lab" class="screen screen-feature">
    <header class="feature-header">
      <button class="text-btn" id="superposition-back-btn">← Labs</button>
      <h2>Superposition Board Lab</h2>
      <button class="text-btn" id="superposition-reset-btn">Reset fixtures</button>
    </header>
    <div class="feature-layout">
      <div class="panel controls-panel">
        <label for="superposition-fen-input">FEN positions (delimiter: newline or semicolon)</label>
        <textarea id="superposition-fen-input" spellcheck="false"></textarea>
        <ul id="superposition-fen-diagnostics" class="diagnostics"></ul>

        <label for="superposition-arrow-input">Arrow coordinates (e.g. e2->e4)</label>
        <textarea id="superposition-arrow-input" spellcheck="false"></textarea>
        <ul id="superposition-arrow-diagnostics" class="diagnostics"></ul>
      </div>

      <div class="panel board-panel" id="superposition-board-panel">
        <canvas id="superposition-canvas"></canvas>
      </div>
    </div>
  </section>

  <section id="screen-chat-lab" class="screen screen-feature">
    <header class="feature-header">
      <button class="text-btn" id="chat-back-btn">← Labs</button>
      <h2>P2P Chat Lab</h2>
      <span></span>
    </header>
    <div class="feature-layout chat-layout">
      <div class="panel controls-panel">
        <div class="chat-meta">
          <div><strong>Room:</strong> <span id="chat-room-code">------</span></div>
          <div id="chat-status">Disconnected</div>
        </div>

        <div class="chat-controls">
          <button class="btn btn-secondary" id="chat-create-room-btn">Create Room</button>
          <div class="join-row">
            <input id="chat-join-code-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000">
            <button class="btn btn-outline" id="chat-join-room-btn">Join</button>
          </div>
          <button class="btn btn-outline" id="chat-disconnect-btn">Disconnect</button>
        </div>
      </div>

      <div class="panel chat-panel">
        <ul id="chat-log" class="chat-log"></ul>
        <div class="chat-compose">
          <input id="chat-draft-input" type="text" placeholder="Type a message...">
          <button class="btn btn-primary" id="chat-send-btn">Send</button>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-centurion-match" class="screen screen-feature">
    <header class="feature-header">
      <button class="text-btn" id="centurion-back-btn">← Labs</button>
      <h2>Centurion Match</h2>
      <span></span>
    </header>
    <div class="centurion-shell panel">
      <p id="centurion-status-copy"></p>
      <div id="centurion-controls" class="centurion-controls">
        <button class="btn btn-primary" id="centurion-single-player-btn">Pass &amp; Play</button>
        <button class="btn btn-secondary" id="centurion-new-match-btn">New Multiplayer Match</button>
        <div class="centurion-join-row">
          <input
            id="centurion-join-code-input"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
          >
          <button class="btn btn-secondary" id="centurion-join-match-btn">Join with code</button>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-single-player-match" class="screen screen-feature">
    <header class="feature-header">
      <button class="text-btn" id="single-player-back-btn">← Back</button>
      <h2>Pass &amp; Play</h2>
      <span id="single-player-turn">Turn 1</span>
    </header>
    <div class="feature-layout single-player-layout">
      <div class="panel controls-panel">
        <div class="single-player-section-label">Arrow History</div>
        <ul id="single-player-history" class="single-player-history"></ul>
        <div class="single-player-compose">
          <label for="single-player-arrow-input">Arrow (e.g. e2-&gt;e4)</label>
          <input
            id="single-player-arrow-input"
            type="text"
            placeholder="e2->e4"
            spellcheck="false"
            autocomplete="off"
          >
          <p id="single-player-error" class="single-player-error"></p>
          <button class="btn btn-primary" id="single-player-submit-btn">Submit Arrow</button>
        </div>
      </div>
      <div class="panel board-panel" id="single-player-board-panel">
        <canvas id="single-player-canvas"></canvas>
      </div>
    </div>
  </section>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
