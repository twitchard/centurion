<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centurion Chess</title>
</head>
<body>
  <section id="screen-menu" class="screen screen-menu">
    <h1>Centurion Chess</h1>
    <p class="subtitle">Radical architecture edition</p>
    <div class="menu-buttons">
      <button class="btn btn-primary" id="menu-open-superposition">Superposition Board Lab</button>
      <button class="btn btn-secondary" id="menu-open-chat">P2P Chat Lab</button>
      <button class="btn btn-outline" id="menu-open-centurion">Centurion Match</button>
    </div>
  </section>

  <section id="screen-superposition-lab" class="screen screen-feature">
    <header class="feature-header">
      <button class="text-btn" id="superposition-back-btn">← Menu</button>
      <h2>Superposition Board Lab</h2>
      <button class="text-btn" id="superposition-reset-btn">Reset fixtures</button>
    </header>
    <div class="feature-layout">
      <div class="panel controls-panel">
        <label for="superposition-fen-input">FEN positions (delimiter: newline or semicolon)</label>
        <textarea id="superposition-fen-input" spellcheck="false"></textarea>
        <ul id="superposition-fen-diagnostics" class="diagnostics"></ul>

        <label for="superposition-arrow-input">Arrow coordinates (e.g. e2->e4)</label>
        <textarea id="superposition-arrow-input" spellcheck="false"></textarea>
        <ul id="superposition-arrow-diagnostics" class="diagnostics"></ul>
      </div>

      <div class="panel board-panel" id="superposition-board-panel">
        <canvas id="superposition-canvas"></canvas>
      </div>
    </div>
  </section>

  <section id="screen-chat-lab" class="screen screen-feature">
    <header class="feature-header">
      <button class="text-btn" id="chat-back-btn">← Menu</button>
      <h2>P2P Chat Lab</h2>
      <span></span>
    </header>
    <div class="feature-layout chat-layout">
      <div class="panel controls-panel">
        <div class="chat-meta">
          <div><strong>Room:</strong> <span id="chat-room-code">------</span></div>
          <div id="chat-status">Disconnected</div>
        </div>

        <div class="chat-controls">
          <button class="btn btn-secondary" id="chat-create-room-btn">Create Room</button>
          <div class="join-row">
            <input id="chat-join-code-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000">
            <button class="btn btn-outline" id="chat-join-room-btn">Join</button>
          </div>
          <button class="btn btn-outline" id="chat-disconnect-btn">Disconnect</button>
        </div>
      </div>

      <div class="panel chat-panel">
        <ul id="chat-log" class="chat-log"></ul>
        <div class="chat-compose">
          <input id="chat-draft-input" type="text" placeholder="Type a message...">
          <button class="btn btn-primary" id="chat-send-btn">Send</button>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-centurion-match" class="screen screen-feature">
    <header class="feature-header">
      <button class="text-btn" id="centurion-back-btn">← Menu</button>
      <h2>Centurion Match</h2>
      <span></span>
    </header>

    <div class="centurion-view" id="centurion-view-start">
      <p>Full integrated match mode</p>
      <div class="menu-buttons">
        <button class="btn btn-primary" id="centurion-btn-pass-play">Pass &amp; Play</button>
        <button class="btn btn-secondary" id="centurion-btn-create-room">Create Room</button>
        <button class="btn btn-outline" id="centurion-btn-join-room">Join Room</button>
      </div>
    </div>

    <div class="centurion-view" id="centurion-view-lobby-create">
      <div class="centurion-lobby-title">Room Created</div>
      <div class="room-code" id="centurion-room-code-display">------</div>
      <button class="btn btn-primary" id="centurion-share-btn">Share Code</button>
      <div class="centurion-lobby-status" id="centurion-create-status">Waiting for opponent...</div>
      <button class="text-btn" id="centurion-create-back">← Back</button>
    </div>

    <div class="centurion-view" id="centurion-view-lobby-join">
      <div class="centurion-lobby-title">Join Room</div>
      <input class="code-input" id="centurion-code-input" type="text" inputmode="numeric"
             maxlength="6" placeholder="000000" autocomplete="off">
      <button class="btn btn-primary" id="centurion-join-btn">Join</button>
      <div class="centurion-lobby-status" id="centurion-join-status"></div>
      <button class="text-btn" id="centurion-join-back">← Back</button>
    </div>

    <div class="centurion-view" id="centurion-view-game">
      <div class="centurion-game-wrap">
        <div class="centurion-board-wrap" id="centurion-board-wrap">
          <div class="board-outer">
            <canvas id="centurion-board-canvas"></canvas>
            <canvas id="centurion-overlay-canvas"></canvas>
          </div>
        </div>
        <div class="centurion-bottom">
          <button class="btn btn-outline" id="centurion-pass-btn">Pass</button>
        </div>
      </div>
    </div>

    <div id="centurion-game-over">
      <div id="centurion-go-title"></div>
      <div id="centurion-go-sub"></div>
      <button class="btn btn-primary" id="centurion-new-match-btn">New Match</button>
    </div>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
