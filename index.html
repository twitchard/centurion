<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Centurion Chess</title>
</head>
<body>

  <!-- Start Screen -->
  <div id="screen-start">
    <h1>Centurion Chess</h1>
    <p>100 simultaneous games &middot; place arrows &middot; shape the superposition</p>
    <div class="start-buttons">
      <button class="btn btn-primary" id="btn-pass-play">Pass &amp; Play</button>
      <button class="btn btn-secondary" id="btn-create-room">Create Room</button>
      <button class="btn btn-outline" id="btn-join-room">Join Room</button>
    </div>
  </div>

  <!-- Create Room Lobby -->
  <div id="screen-lobby-create">
    <div class="lobby-title">Room Created</div>
    <div class="room-code" id="room-code-display">------</div>
    <div class="share-btn-row">
      <button class="btn btn-primary" id="share-btn">Share Code</button>
    </div>
    <div class="lobby-status" id="create-status">
      <span class="spinner">Waiting for opponent...</span>
    </div>
    <button class="lobby-back" id="create-back">← Back</button>
  </div>

  <!-- Join Room Lobby -->
  <div id="screen-lobby-join">
    <div class="lobby-title">Join Room</div>
    <input class="code-input" id="code-input" type="text" inputmode="numeric"
           maxlength="6" placeholder="000000" autocomplete="off">
    <button class="btn btn-primary" id="join-btn">Join</button>
    <div class="lobby-status" id="join-status"></div>
    <button class="lobby-back" id="join-back">← Back</button>
  </div>

  <!-- Game Screen -->
  <div id="app">
    <div class="top">
      <div class="player-info">
        <div class="player-dot dot-w"></div>
        <div class="player-score" id="s1">0</div>
        <div>
          <div class="player-label" id="label1">Player 1</div>
          <div class="turn-ind active" id="ti1">YOUR TURN</div>
        </div>
      </div>
      <div style="text-align:center">
        <div class="vs">vs</div>
        <div class="game-count"><span id="uiActive">100</span> active</div>
      </div>
      <div class="player-info" style="flex-direction:row-reverse">
        <div class="player-dot dot-b"></div>
        <div class="player-score" id="s2">0</div>
        <div style="text-align:right">
          <div class="player-label" id="label2">Player 2</div>
          <div class="turn-ind waiting" id="ti2">WAITING</div>
        </div>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board-outer" id="boardOuter">
        <canvas id="bc"></canvas>
        <canvas id="ov"></canvas>
      </div>
    </div>

    <div class="bottom">
      <div class="toggle-group">
        <button class="toggle-btn active" data-v="all">All</button>
        <button class="toggle-btn" data-v="white">White</button>
        <button class="toggle-btn" data-v="black">Black</button>
      </div>
      <button class="pass-btn" id="pass-btn">Pass</button>
      <div class="hint-text" id="hint"></div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="screen-game-over">
    <div id="goTitle"></div>
    <div id="goSub"></div>
    <button id="new-match-btn">New Match</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
