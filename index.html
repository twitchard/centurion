<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Centurion Chess</title>
</head>
<body>

  <!-- Start Screen -->
  <div id="screen-start">
    <h1>Centurion Chess</h1>
    <p>100 simultaneous games &middot; place arrows &middot; shape the superposition</p>
    <div class="start-buttons">
      <button class="btn btn-primary" id="btn-pass-play">Pass &amp; Play</button>
      <button class="btn btn-secondary" id="btn-create-room">Create Room</button>
      <button class="btn btn-outline" id="btn-join-room">Join Room</button>
    </div>
  </div>

  <!-- Create Room Lobby -->
  <div id="screen-lobby-create">
    <div class="lobby-title">Room Created</div>
    <div class="room-code" id="room-code-display">------</div>
    <div class="share-btn-row">
      <button class="btn btn-primary" id="share-btn">Share Code</button>
    </div>
    <div class="lobby-status" id="create-status">
      <span class="spinner">Waiting for opponent...</span>
    </div>
    <button class="lobby-back" id="create-back">← Back</button>
  </div>

  <!-- Join Room Lobby -->
  <div id="screen-lobby-join">
    <div class="lobby-title">Join Room</div>
    <input class="code-input" id="code-input" type="text" inputmode="numeric"
           maxlength="6" placeholder="000000" autocomplete="off">
    <button class="btn btn-primary" id="join-btn">Join</button>
    <div class="lobby-status" id="join-status"></div>
    <button class="lobby-back" id="join-back">← Back</button>
  </div>

  <!-- Game Screen -->
  <div id="app">
    <div class="board-wrap">
      <div class="board-outer" id="boardOuter">
        <canvas id="bc"></canvas>
        <canvas id="ov"></canvas>
      </div>
    </div>

    <div class="bottom">
      <button class="pass-btn" id="pass-btn">Pass</button>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="screen-game-over">
    <div id="goTitle"></div>
    <div id="goSub"></div>
    <button id="new-match-btn">New Match</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
